name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Attach theme files to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            muyun.css
            muyun-dark.css
            muyun-wide.css
            muyun-wide-dark.css
            README.md
