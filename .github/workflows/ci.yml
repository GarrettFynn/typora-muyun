name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 主题结构门禁（花括号 / @import 链 / 令牌完备性 / 对比度）
        run: node scripts/check-theme.mjs
